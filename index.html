<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Freedom in the World</title>
  <link rel="stylesheet" href="intro.css">
</head>
<body>

  <div id="canvasContainer"></div>

  <div id="contenuto">
    <section class="sezione" id="sezione-titolo">
      <h1 class="titolo-principale">Liberty Enlightening the World</h1>
    </section>
    <section class="sezione" id="sezione-transizione"></section>
    <div class="spacer-finale"></div>
  </div>

  <div id="ui-overlay">
    
    <div id="typewriter-wrapper">
      <span id="typewriter-text"></span><span class="cursor">|</span>
    </div>
    
    <div id="click-prompt">Click to start</div>
    
    <div id="final-cta-container">
      <span class="cta-text">scroll to continue</span>
      <div class="cta-arrow">
        <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </div>
    </div>

  </div>

  <div class="scroll-indicator">
    <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"></polyline></svg>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="https://unpkg.com/@studio-freight/lenis@1.0.42/dist/lenis.min.js"></script>
  
  <script src="aloneAnimato.js"></script>
  <script src="intro.js"></script>

</body>
</html>
